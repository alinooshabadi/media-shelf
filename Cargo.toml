[workspace]
members = ["ui/media-shelf-ui"]
resolver = "2"

[package]
name = "media-shelf"
version = "0.6.9"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
regex = "1"
roxmltree = "0.20"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Security_Cryptography", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSFileManager", "NSString", "NSError"] }

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
roxmltree = "0.20"
